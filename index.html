
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>NewsIral</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NewsIral">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>

<body>

  <iframe
    id="appFrame"
    allow="clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>

  <script>
    // URL GAS
    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbzMYYQQYXrK107oYDRQmkFjjvzvtMOG7dOr54HKSVWEJ-UrvkmpEpw5ehKS1H2hHIGg/exec';

    // Teruskan parameter URL Vercel ke GAS
    const params = new URLSearchParams(window.location.search);

    const iframeUrl = new URL(GAS_URL);

    params.forEach((value, key) => {
      iframeUrl.searchParams.set(key, value);
    });

    document.getElementById('appFrame').src = iframeUrl.toString();

    // Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('PWA aktif:', registration.scope);
          })
          .catch(error => {
            console.error('PWA gagal:', error);
          });
      });
    }
  </script>

</body>
</html>
